# Configuracao de conexao com o banco.
# Os mesmos valores servem para o container Docker e para uma
# instalacao nativa do PostgreSQL. Ajuste apenas se mudar a porta.

db.url=jdbc:postgresql://localhost:5432/bibliotech
db.user=bibliotech
db.password=bibliotech

# Pool de conexoes (HikariCP)
db.pool.maximumPoolSize=5
db.pool.minimumIdle=2
db.pool.connectionTimeoutMs=5000

# Regras de negocio parametrizaveis
regra.limiteEmprestimosPorUsuario=3
regra.diasPrazoEmprestimo=15
regra.diasValidadeReserva=7
